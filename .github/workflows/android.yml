name: Build Android

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Play Store"
        required: true
        type: boolean
        default: false
      track:
        description: "Play Store track"
        required: true
        type: choice
        default: Internal Testing
        options:
          - Internal Testing
          - Closed Testing
          - Open Testing
          - Production

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_NAME: ${{ steps.pkg.outputs.PACKAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_JKS_B64: ${{ secrets.UPLOAD_KEYSTORE_JKS_B64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_JKS_B64" | base64 -d > ${{ runner.temp }}/upload-keystore.jks

      - name: Verify keystore contents
        run: |
          keytool -list -v \
            -keystore ${{ runner.temp }}/upload-keystore.jks \
            -alias upload \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Create key.properties
        run: |
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=${{ runner.temp }}/upload-keystore.jks
          EOF

      - name: Determine package name
        id: pkg
        run: |
          pkg=$(sed -n 's/.*applicationId *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          echo "PACKAGE_NAME=$pkg" >> $GITHUB_OUTPUT

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-number=$(( GITHUB_RUN_NUMBER + 0 ))

      - name: Build release APK
        if: ${{ !inputs.deploy }}
        run: flutter build apk --release

      - name: Build debug APK
        if: ${{ !inputs.deploy }}
        run: flutter build apk --debug

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Upload release APK artifact
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v6
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Upload debug APK artifact
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v6
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

      - name: Cleanup keystore file
        if: always()
        run: rm -f ${{ runner.temp }}/upload-keystore.jks

  deploy:
    name: Publish to Play Store
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: app-release.aab

      - name: Decode service account
        env:
          SERVICE_ACCOUNT_JSON_B64: ${{ secrets.SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON_B64" | base64 -d > service-account.json

      - name: Map friendly track name
        run: |
          case "${{ inputs.track }}" in
            "Internal Testing") TRACK=internal ;;
            "Closed Testing") TRACK=alpha ;;
            "Open Testing") TRACK=beta ;;
            "Production") TRACK=production ;;
          esac
          echo "TRACK=$TRACK" >> $GITHUB_ENV

      - name: Publish AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: ${{ needs.build.outputs.PACKAGE_NAME }}
          releaseFiles: app-release.aab
          track: ${{ env.TRACK }}

      - name: Cleanup service account file
        if: always()
        run: rm -f service-account.json
